<div class="sidebar">
  <div class="sidebar-header"><div class="logo"><span class="brand-copy"><span class="ask-pnc"><span class="ask-word">Ask</span> PNC</span><span class="enterprise-brain">Enterprise Brain</span></span></div></div>
  <nav class="pnc-nav" aria-label="Primary navigation">
  </nav>
  <div class="divider"></div>
  <div class="history-section">
    <h3 class="section-label">Recent Chats</h3>
    <ul class="history-list" *ngIf="history.length > 0; else noHistory">
      <li *ngFor="let item of history.slice().reverse()" class="history-item" (click)="onSelectChat(item.sessionId)" (mouseleave)="activeMenu = null">
        <span class="material-icons history-icon">chat_bubble_outline</span>
        <span class="history-text" *ngIf="renamingSessionId !== item.sessionId">{{ getCustomTitle(item.sessionId) || item.content }}</span>
        <input #nameInput type="text" class="rename-input" *ngIf="renamingSessionId === item.sessionId" [value]="getCustomTitle(item.sessionId) || item.content" (click)="$event.stopPropagation()" (keydown.enter)="saveRename(item.sessionId, nameInput.value)" (keyup.escape)="cancelRename()" (blur)="cancelRename()" />
        <div class="menu-dots" *ngIf="renamingSessionId !== item.sessionId" (click)="$event.stopPropagation(); toggleMenu(item.sessionId)">•••</div>
        <div class="dropdown-menu" *ngIf="activeMenu === item.sessionId"><div class="dropdown-item" (click)="$event.stopPropagation(); startRename(item.sessionId)">Rename</div><div class="dropdown-item delete" (click)="$event.stopPropagation(); deleteChat(item.sessionId)">Delete</div></div>
      </li>
    </ul>
    <ng-template #noHistory><div class="no-history"><span class="material-icons">chat_bubble_outline</span><p>No conversations yet</p></div></ng-template>
  </div>
</div>
